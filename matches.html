// ============ MATH ============
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}

// ============ H2H & COMMON OPPONENT ============
const TEAM_CODE_MAP = {
  'Mexico':'mex','South Africa':'rsa','South Korea':'kor','Czech Republic':'cze',
  'Canada':'can','Bosnia-Herzegovina':'bih','Qatar':'qat','Switzerland':'sui',
  'Brazil':'bra','Morocco':'mar','Haiti':'hai','Scotland':'sco',
  'United States':'usa','Paraguay':'par','Australia':'aus','Turkey':'tur',
  'Germany':'ger','Curacao':'cuw','Ivory Coast':'civ','Ecuador':'ecu',
  'Netherlands':'ned','Japan':'jpn','Sweden':'swe','Tunisia':'tun',
  'Belgium':'bel','Egypt':'egy','Iran':'irn','New Zealand':'nzl',
  'Spain':'esp','Cape Verde':'cpv','Saudi Arabia':'ksa','Uruguay':'uru',
  'France':'fra','Senegal':'sen','Iraq':'irq','Norway':'nor',
  'Argentina':'arg','Algeria':'alg','Austria':'aut','Jordan':'jor',
  'Portugal':'por','Congo DR':'cod','Uzbekistan':'uzb','Colombia':'col',
  'England':'eng','Croatia':'cro','Ghana':'gha','Panama':'pan'
};
function getWinrate(match, team){
  const t=team, total=match.total||0;
  if(total<=0) return 0.5;
  const code=TEAM_CODE_MAP[t]||t.toLowerCase().replace(/ /g,'_');
  if(match[code+'_wins']!=null) return match[code+'_wins']/total;
  // Fallback: search keys
  for(const[k,v]of Object.entries(match)){
    if(k.endsWith('_wins')){
      const prefix=k.replace('_wins','');
      if(code.startsWith(prefix)||prefix===code.slice(0,3)) return v/total;
  }}
  return 0.5;
}
function computeH2hBoost(home, away, h2hData){
  if(!h2hData) return {boost:1.0, info:'', coInfo:'', h2hMod:0, coMod:0};
  const h2h=h2hData.head_to_head||{};
  const k1=home+'_vs_'+away, k2=away+'_vs_'+home;
  const k1u=home.replace(/ /g,'_')+'_vs_'+away.replace(/ /g,'_');
  const k2u=away.replace(/ /g,'_')+'_vs_'+home.replace(/ /g,'_');
  const match=h2h[k1]||h2h[k2]||h2h[k1u]||h2h[k2u]||{};
  const total=match.total||0;
  let h2hMod=0, info='';
  if(total>0){
    const wr=getWinrate(match, home);
    h2hMod=wr-0.5;
    info=(h2hMod>0.01?'📜上风':'')+(h2hMod<-0.01?'📜劣势':'')+(Math.abs(h2hMod)<0.01?'📜均势':'');
    info+=` ${total}场${Math.round(wr*100)}%`;
  }else if(match.note){
    info='🆕首遇';
  }
  // Common opponent
  let coMod=0, coInfo='';
  const oppsA=new Map(), oppsB=new Map();
  for(const[k,m]of Object.entries(h2h)){
    const parts=k.split('_vs_'); if(parts.length!==2) continue;
    const t1=parts[0].replace(/_/g,' '), t2=parts[1].replace(/_/g,' ');
    if(t1===home) oppsA.set(t2, getWinrate(m, home));
    else if(t2===home) oppsA.set(t1, getWinrate(m, home));
    if(t1===away) oppsB.set(t2, getWinrate(m, away));
    else if(t2===away) oppsB.set(t1, getWinrate(m, away));
  }
  let wSum=0, tW=0;
  for(const[c,wrA]of oppsA){
    if(oppsB.has(c)){
      const wrB=oppsB.get(c);
      const diff=wrA-wrB;
      const wt=0.4; // simplified weight
      wSum+=diff*wt; tW+=wt;
  }}
  if(tW>0){ coMod=wSum/tW; coMod=Math.max(-1,Math.min(1,coMod)); }
  if(oppsA.size>0&&oppsB.size>0){
    let common=0; for(const[c]of oppsA){if(oppsB.has(c))common++;}
    if(common>0) coInfo=`🔄${common}队共对${coMod>0.05?'↑':coMod<-0.05?'↓':'→'}`;
  }
  const boost=1.0+h2hMod*0.05+coMod*0.02;
  return {boost:Math.max(0.95,Math.min(1.05,boost)), info, coInfo, h2hMod, coMod};
}

// ============ DIXON-COLES PREDICT (V2 Enhanced) ============
// Environmental factor: heat × altitude × roof
function envFactor(cityName, roof, elevM, envCities){
  if(roof) return 1.00; // indoor = climate controlled
  const c = envCities[cityName] || {};
  const risk = (c.heat_risk || 'LOW').toUpperCase();
  let hf = 1.00;
  if(risk.includes('EXTREME')) hf = 0.88;
  else if(risk.includes('HIGH')) hf = 0.92;
  else if(risk.includes('MODERATE')) hf = 0.96;
  // Altitude
  let af = 1.00;
  if(elevM >= 1800) af = 0.90;
  else if(elevM >= 1000) af = 0.95;
  return hf * af;
}

function dcPredict(home, away, players, rankings, gkRatings, supplement, teamPowers, envCities, venueInfo, betfairIndex, newsData, h2hData, injuryPenaltyMap){
  // === CALIBRATED xG FORMULA (V5, backtested on 403 real matches) ===
  // Uses teamPowers from model.py V5 (same as Python backend)
  let homePower = 8.0, awayPower = 8.0;
  if(teamPowers && teamPowers[home] && teamPowers[away]){
    homePower = teamPowers[home].combined || 8.0;
    awayPower = teamPowers[away].combined || 8.0;
  }
  // Injury penalty reduces team power directly
  if(injuryPenaltyMap){
    homePower -= (injuryPenaltyMap[home]||0) * 1.5;
    awayPower -= (injuryPenaltyMap[away]||0) * 1.5;
    homePower = Math.max(homePower, 3.0);
    awayPower = Math.max(awayPower, 3.0);
  }
  // Calibrated xG: 0.3 + power/9 + home_advantage(0.10)
  let lam = 0.3 + homePower / 9.0 + 0.10;
  let mu  = 0.3 + awayPower / 9.0;

  // === ENVIRONMENTAL FACTOR ===
  let envH = 1.0, envA = 1.0;
  if(venueInfo && envCities){
    const city = venueInfo.city || '';
    const roof = venueInfo.roof || false;
    const elev = venueInfo.elevation_m || 0;
    envH = envFactor(city, roof, elev, envCities);
    envA = envFactor(city, roof, elev, envCities);
  }

  // === BETFAIR MONEY FLOW ===
  let bfBoost = 1.0, mfH = 0, mfA = 0;
  if(betfairIndex){
    const runners = betfairIndex.runners || {};
    for(const [key, info] of Object.entries(runners)){
      if(typeof key === 'string'){
        if(key.toLowerCase().includes(home.toLowerCase())) mfH = info.money_flow || 0;
        if(key.toLowerCase().includes(away.toLowerCase())) mfA = info.money_flow || 0;
      }
    }
    const netFlow = mfH - mfA;
    bfBoost = 1.0 + netFlow * 0.15;
    bfBoost = Math.max(0.88, Math.min(1.12, bfBoost));
  }

  // === NEWS SENTIMENT ===
  let newsH = 0, newsA = 0;
  if(newsData && newsData.articles){
    const posWords = ['win','victory','confident','star','fit','return','boost','hat-trick','record','top','best','favorite','triumph'];
    const negWords = ['injury','injured','doubt','loss','defeat','out','suspended','struggle','disappointing','blow','setback','worry','crisis'];
    function teamNewsSent(team){
      const kw = (newsData.team_keywords||{})[team] || [team.toLowerCase()];
      let pos=0, neg=0, total=0;
      (newsData.articles||[]).forEach(a=>{
        const text = ((a.title||'')+' '+(a.summary||'')).toLowerCase();
        if(kw.some(k=>text.includes(k.toLowerCase()))){
          total++;
          const pc = posWords.filter(w=>text.includes(w)).length;
          const nc = negWords.filter(w=>text.includes(w)).length;
          if(nc>pc) neg++; else if(pc>nc) pos++;
        }
      });
      return total>0 ? (pos-neg)/total : 0;
    }
    newsH = teamNewsSent(home);
    newsA = teamNewsSent(away);
  }
  const newsBoost = 1.0 + (newsH - newsA) * 0.06;
  const clampedNews = Math.max(0.92, Math.min(1.08, newsBoost));

  // === H2H ===
  const h2hRes = computeH2hBoost(home, away, h2hData);
  const h2hBoost = h2hRes.boost;

  // Apply environmental/betfair/news/h2h multipliers to xG
  lam = lam * envH * bfBoost * clampedNews * h2hBoost;
  mu  = mu  * envA;

  // === DIXON-COLES SIMULATION (rho = -0.18, calibrated against 403-match backtest) ===
  const rho = -0.18;
  let hw=0,dw=0,aw=0,o25=0,btts=0,totalP=0,scores=[];
  for(let h=0;h<=10;h++)for(let a=0;a<=10;a++){
    let p=Math.pow(lam,h)*Math.exp(-lam)/fact(h)*Math.pow(mu,a)*Math.exp(-mu)/fact(a);
    if(h===0&&a===0)p*=(1-lam*mu*rho);else if(h===0&&a===1)p*=(1+lam*rho);
    else if(h===1&&a===0)p*=(1+mu*rho);else if(h===1&&a===1)p*=(1-rho);
    p=Math.max(p,0);scores.push({h,a,p});totalP+=p;
    if(h>a)hw+=p;else if(h===a)dw+=p;else aw+=p;
    if(h+a>2.5)o25+=p;if(h>0&&a>0)btts+=p;
  }
  if(totalP>0){hw/=totalP;dw/=totalP;aw/=totalP;o25/=totalP;btts/=totalP;}
  scores.sort((a,b)=>b.p-a.p);

  // === PREDICTION: probability-gap-based (synced with Python predict_match) ===
  const probGap=Math.abs(hw-aw); let prediction;
  if(probGap<0.06) prediction='D';
  else if(probGap<0.12 && Math.max(hw,aw)<0.52) prediction='D';
  else if(hw>aw && hw>dw) prediction='H';
  else if(aw>hw && aw>dw) prediction='A';
  else prediction='D';

  // === SCORE WEIGHTING from 2022 actual data ===
  // 2022 WC favorites won with: 2-0(28%), 1-0(16%), 2-1(16%)
  // 2022 WC draws: 0-0(45%), 1-1(36%)
  // Weight scores by 2022 frequency for this gap category
  const powerGap=homePower-awayPower;
  const gapCat = Math.abs(powerGap)>3 ? 'big' : Math.abs(powerGap)>1.5 ? 'slight' : 'even';
  const w2022 = {
    // Big favorite wins → clean sheets common
    big_H:   {'2-0':0.28,'1-0':0.16,'2-1':0.16,'3-0':0.08,'3-1':0.08,'4-1':0.12,'3-2':0.04,'6-2':0.04,'6-1':0.04},
    big_A:   {'0-2':0.28,'0-1':0.16,'1-2':0.16,'0-3':0.08,'1-3':0.08,'1-4':0.12,'2-3':0.04,'2-6':0.04,'1-6':0.04},
    // Slight favorite → closer scores
    slight_H:{'2-1':0.22,'1-0':0.22,'2-0':0.17,'3-1':0.11,'1-1':0.11,'0-0':0.06,'3-2':0.06,'4-1':0.06},
    slight_A:{'1-2':0.22,'0-1':0.22,'0-2':0.17,'1-3':0.11,'1-1':0.11,'0-0':0.06,'2-3':0.06,'1-4':0.06},
    // Even match → draws dominate
    even_D:  {'0-0':0.45,'1-1':0.36,'2-2':0.09,'3-3':0.09},
    even_H:  {'1-0':0.33,'2-1':0.33,'2-0':0.17,'3-1':0.17},
    even_A:  {'0-1':0.33,'1-2':0.33,'0-2':0.17,'1-3':0.17},
  };
  const catKey = gapCat+'_'+prediction;
  const weights = w2022[catKey] || {};

  // Apply 2022 weights to Dixon-Coles scores
  let weightedScores = scores.map(s=>{
    const key=s.h+'-'+s.a;
    const w = weights[key] || 0.01; // small weight for unlisted scores
    return {...s, p: s.p * w};
  });
  weightedScores.sort((a,b)=>b.p-a.p);

  const upsetPct=Math.round(Math.min(0.42*Math.exp(-Math.abs(powerGap)*0.08),0.49)*100);
  return{hw,dw,aw,lam:lam.toFixed(1),mu:mu.toFixed(1),o25,btts,upsetPct,
    s1:weightedScores[0]||scores[0]||{h:1,a:0},s1p:weightedScores[0]?.p||scores[0]?.p||0,
    s2:weightedScores[1]||scores[1]||{h:1,a:1},s2p:weightedScores[1]?.p||scores[1]?.p||0,
    diff:lam-mu, envH, envA, bfBoost, mfH, mfA, newsH, newsA, newsBoost:clampedNews,
    h2hBoost, prediction, powerH:homePower, powerA:awayPower};
}

// ============ ASIAN HANDICAP ============
function asianHandicap(diff){
  const d=diff;
  if(Math.abs(d)<0.3)return{line:'平手盘',pick:'无方向',dir:''};
  if(d>=0.3&&d<0.7)return{line:'平手(主队方向)',pick:'主队 平手',dir:'home'};
  if(d>=0.7&&d<1.1)return{line:'主让半球(-0.5)',pick:'主队-0.5',dir:'home'};
  if(d>=1.1&&d<1.6)return{line:'主让半一(-0.5/1)',pick:'主队-0.5/1',dir:'home'};
  if(d>=1.6&&d<2.1)return{line:'主让一球(-1)',pick:'主队-1',dir:'home'};
  if(d>=2.1&&d<2.6)return{line:'主让球半(-1.5)',pick:'主队-1.5',dir:'home'};
  if(d>=2.6)return{line:'主让两球(-2)',pick:'主队-2',dir:'home'};
  if(d<=-0.3&&d>-0.7)return{line:'平手(客队方向)',pick:'客队 平手',dir:'away'};
  if(d<=-0.7&&d>-1.1)return{line:'客让半球(+0.5)',pick:'客队-0.5',dir:'away'};
  if(d<=-1.1&&d>-1.6)return{line:'客让半一(+0.5/1)',pick:'客队-0.5/1',dir:'away'};
  if(d<=-1.6&&d>-2.1)return{line:'客让一球(+1)',pick:'客队-1',dir:'away'};
  if(d<=-2.1)return{line:'客让球半(+1.5)',pick:'客队-1.5',dir:'away'};
  return{line:'平手',pick:'无方向',dir:''};
}

// ============ RENDER ============
function renderMatch(pred,m){
  const{lam,mu,o25,upsetPct,s1,s1p,s2,s2p}=pred;
  const ah=asianHandicap(pred.diff);
  let pick1x2,pickCls;
  if(pred.hw>=pred.dw&&pred.hw>=pred.aw){pick1x2='主胜';pickCls='hl'}
  else if(pred.dw>=pred.hw&&pred.dw>=pred.aw){pick1x2='平局';pickCls=''}
  else{pick1x2='客胜';pickCls='hl'}
  const hb=Math.round(pred.hw*100),db=Math.round(pred.dw*100),ab=Math.round(pred.aw*100);
  const upsetCls=upsetPct>35?'br':upsetPct>25?'by':'bg';
  // Environmental/V2 impact badges (always show when data available)
  const envH=pred.envH||1, envA=pred.envA||1;
  const hasEnv = envH<0.98 || envA<0.98;
  const envBadge=hasEnv?`<span class="badge br" style="font-size:9px;margin-left:4px" title="xG环境修正: 主${envH.toFixed(2)} 客${envA.toFixed(2)}">🌡️x${envH.toFixed(2)}</span>`:'';
  const pH=pred.powerH||8, pA=pred.powerA||8;
  const v2Badge=`<span class="badge bb" style="font-size:9px;margin-left:2px" title="V5综合力量: H${pH.toFixed(1)} vs A${pA.toFixed(1)}">V5</span>`;
  // Betfair money flow badge
  const bfB=pred.bfBoost||1, mfH=pred.mfH||0, mfA=pred.mfA||0;
  const hasBF = Math.abs(bfB-1)>0.005;
  const bfLabel = bfB>1.005?`必发↑${((bfB-1)*100).toFixed(0)}%`:bfB<0.995?`必发↓${((1-bfB)*100).toFixed(0)}%`:'';
  // News sentiment badge
  const newsB=pred.newsBoost||1, nH=pred.newsH||0, nA=pred.newsA||0;
  const hasNews = Math.abs(nH)>0.1 || Math.abs(nA)>0.1;
  const newsBadge=hasNews?`<span class="badge" style="font-size:9px;margin-left:2px;background:#004d40;color:#80cbc4" title="News sentiment: H${nH>0?'+':''}${(nH*100).toFixed(0)}% A${nA>0?'+':''}${(nA*100).toFixed(0)}%">NEWS${newsB>1.005?'+':newsB<0.995?'-':''}</span>`:'';
  const bfBadge=hasBF?`<span class="badge" style="font-size:9px;margin-left:2px;background:#6a1b9a;color:#ce93d8" title="必发资金流: 主${mfH>0?'+':''}${(mfH*100).toFixed(0)}% vs 客${mfA>0?'+':''}${(mfA*100).toFixed(0)}% | xG修正: ${bfB.toFixed(3)}">${bfLabel}</span>`:'';
  // H2H badge
  const h2hInfo=pred.h2hInfo||'', coInfo=pred.coInfo||'';
  const hasH2h=Math.abs((pred.h2hBoost||1)-1)>0.002 || h2hInfo;
  const h2hMod=pred.h2hMod||0;
  const h2hBadge=hasH2h?`<span class="badge" style="font-size:9px;margin-left:2px;background:${h2hMod>0.01?'#1b3a1b':h2hMod<-0.01?'#3a1b1b':'#1a2735'};color:${h2hMod>0.01?'#81c784':h2hMod<-0.01?'#ef9a9a':'#90a4ae'}" title="H2H: ${h2hInfo} | Common opp: ${coInfo||'none'} | xG boost: ${(pred.h2hBoost||1).toFixed(4)}">${h2hInfo||'📜'}${coInfo?' '+coInfo:''}</span>`:'';
  const h2hBadge2=hasH2h?h2hBadge:'';

  return `<div class="match-row" data-group="${m.g}" data-date="${m.date}">
    <div class="time">${m.g}组</div>

    <div class="matchup"><span>${zhT(m.h)}</span><span class="vs">vs</span><span>${zhT(m.a)}</span>${envBadge}${v2Badge}${bfBadge}${newsBadge}${h2hBadge2}</div>
    <div class="venue">${zhCi(m.v)||m.v}</div>
    <div class="odds-cell ${pickCls}">
      <div class="val">${pick1x2}</div>
      <div style="font-size:9px;margin-top:1px">
        <span style="color:#4fc3f7">${hb}%</span>/<span style="color:#b0bec5">${db}%</span>/<span style="color:#ff8a65">${ab}%</span>
      </div>
      <div style="margin-top:2px"><span class="progress h" style="width:${hb}px"></span><span class="progress d" style="width:${db}px"></span><span class="progress a" style="width:${ab}px"></span></div>
    </div>
    <div class="handicap"><div class="line">${ah.line}</div></div>
    <div class="handicap"><div class="pick">${ah.pick}</div></div>
    <div class="score">
      <div class="goals">${s1.h}:${s1.a} <span style="font-size:9px;color:#66bb6a">${(s1p*100).toFixed(0)}%</span></div>
      <div class="goals2">${s2.h}:${s2.a} <span style="font-size:8px">${(s2p*100).toFixed(0)}%</span></div>
      <div class="xgoals">xG ${lam}-${mu}</div>
    </div>
    <div class="score">
      <div style="color:${o25>0.5?'#66bb6a':'#78909c'};font-weight:600;font-size:12px">${o25>0.5?'大2.5':'小2.5'}</div>
      <div class="xgoals">O${(o25*100).toFixed(0)}% U${((1-o25)*100).toFixed(0)}%</div>
    </div>
    <div class="upset"><span class="badge ${upsetCls}">${upsetPct}%</span></div>
  </div>`;
}

// ============ FILTER ============
function doFilter(){
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const gf=document.getElementById('groupFilter')?.value||'';
  const df=document.getElementById('dateFilter')?.value||'';
  document.querySelectorAll('.match-row').forEach(row=>{
    const text=row.textContent.toLowerCase();
    const g=row.dataset.group||'',d=row.dataset.date||'';
    row.style.display=(!q||text.includes(q))&&(!gf||g===gf)&&(!df||d===df)?'':'none';
  });
  document.querySelectorAll('.date-header').forEach(h=>{
    const dd=h.dataset.date||'';
    h.style.display=document.querySelector('.match-row[data-date="'+dd+'"]:not([style*="display: none"])')?'':'none';
  });
}

// ============ MAIN ============
async function main(){
  const content=document.getElementById('content');
  try{
    // Load data
    const r=await fetch('data/all_data.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const all=await r.json();
    ALL_DATA=all;

    // Chinese names
    const zh=all.zh_names||{};
    ZT=zh.teams||{};ZP=zh.players||{};ZC=zh.clubs||{};ZCI=zh.cities||{};

    // Data extraction
    const rankings=all.fifa_rankings?.rankings||[];
    const gkRatings=all.goalkeepers?.team_gk_rating?.ratings||{};
    const supplement=all.player_stats_supplement?.players||[];
    const teamPowers=all.tournament_results?.team_powers||{};
    const envCities=all.environment?.cities||{};
    const betfairIndex=all.betfair_index?.betfair_index||null;
    // Injury data for match prediction accuracy
    const injuriesData=all.injuries||{};
    const teamInjuryPenalty={};
    if(injuriesData.injuries){
      // Compute per-team injury penalty (simplified, mirrors Python compute_injury_penalty)
      const sevW = {critical:1.0, major:0.55, moderate:0.25, minor:0.08};
      const statusM = {out:1.0, doubtful:0.7, questionable:0.4, probable:0.15, fit:0};
      injuriesData.injuries.forEach(i=>{
        if(!i.nation) return;
        const w = (sevW[i.severity]||0.25) * (statusM[i.status]||0);
        teamInjuryPenalty[i.nation] = Math.min((teamInjuryPenalty[i.nation]||0) + w, 2.5);
      });
    }
    const newsArticles = all.news_feed?.articles || [];
    const h2hData = all.head_to_head || null;
    // Team keywords for news matching (sync with Python TEAM_KEYWORDS)
    const TEAM_KW = {
      'Spain':['spain','españa','yamal','rodri','pedri'],'France':['france','mbappé','mbappe','olise'],
      'England':['england','kane','bellingham','saka'],'Brazil':['brazil','brasil','neymar','vinícius'],
      'Argentina':['argentina','messi','lautaro'],'Portugal':['portugal','ronaldo','bruno'],
      'Germany':['germany','musiala','wirtz'],'Netherlands':['netherlands','van dijk','gakpo'],
      'Norway':['norway','haaland','odegaard'],'United States':['usa','united states','pulisic'],
      'Mexico':['mexico','méxico','el tri'],'Japan':['japan','mitoma','kubo'],
      'South Korea':['south korea','son heung'],'Croatia':['croatia','modrić','modric'],
      'Belgium':['belgium','de bruyne','lukaku'],'Senegal':['senegal','mané','mane'],
      'Morocco':['morocco','hakimi'],'Colombia':['colombia','luis díaz'],
      'Uruguay':['uruguay','valverde','núñez'],'Sweden':['sweden','isak','gyökeres'],
      'Egypt':['egypt','salah','marmoush'],'Canada':['canada','davies'],
      'Scotland':['scotland','mctominay','robertson']
    };

    // Build venue lookup from match_schedule (city + roof + elevation per match)
    const venueLookup = {};
    const ms = all.match_schedule?.matches || {};
    ['matchday_1','matchday_2','matchday_3'].forEach(md => {
      (ms[md]||[]).forEach(m => {
        const key = m.home + '|' + m.away;
        const cityMap2 = {'Boston':'Boston / Foxborough','Los Angeles':'Los Angeles / Inglewood','San Francisco':'San Francisco / Santa Clara'};
        const envCity = cityMap2[m.city] || m.city || '';
        venueLookup[key] = {city: envCity, roof: m.roof||false, elevation_m: m.elevation_m||0};
        // Also store reverse
        venueLookup[m.away + '|' + m.home] = {city: envCity, roof: m.roof||false, elevation_m: m.elevation_m||0};
      });
    });

    // Build player list
    const players=[];
    if(all.world_cup_players?.groups){
      Object.entries(all.world_cup_players.groups).forEach(([gn,gdata])=>{
        Object.entries(gdata.teams||{}).forEach(([nat,tdat])=>{
          (tdat.players||[]).forEach(p=>{
            const sp=supplement.find(s=>s.name===p.name&&s.nation===nat);
            players.push({
              name:p.name||'',nation:nat,group:gn,
              goals_2526:sp?.goals_2526??p.goals_2526??0,
              assists_2526:sp?.assists_2526??p.assists_2526??0,
              goals_2425:p.goals_2425,rating:sp?.rating??p.rating
            });
          });
        });
      });
    }

    // Populate filter dropdowns
    const gf=document.getElementById('groupFilter');
    'ABCDEFGHIJKL'.split('').forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+'组';gf.appendChild(o);});

    const dates=[...new Set(Object.keys(MATCHES_BY_DATE))].sort();
    const df=document.getElementById('dateFilter');
    dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;df.appendChild(o);});

    // Render
    let html='';
    const phases=[
      {id:'md1',title:'📅 小组赛 第1轮 · 6月11日-17日',dates:dates.filter(d=>d<='2026-06-17')},
      {id:'md2',title:'📅 小组赛 第2轮 · 6月18日-23日',dates:dates.filter(d=>d>='2026-06-18'&&d<='2026-06-23')},
      {id:'md3',title:'📅 小组赛 第3轮 · 6月24日-27日',dates:dates.filter(d=>d>='2026-06-24')},
    ];

    phases.forEach(phase=>{
      if(phase.dates.length===0)return;
      html+=`<div class="phase-title" id="${phase.id}"><h2>${phase.title}</h2></div>`;
      phase.dates.forEach(date=>{
        html+=`<div class="date-header" data-date="${date}"><h3>📅 ${date}</h3></div>`;
        (MATCHES_BY_DATE[date]||[]).forEach(m=>{
          m.date=date;
          const vKey = m.h + '|' + m.a;
          const venueInfo = venueLookup[vKey] || {};
          const pred=dcPredict(m.h,m.a,players,rankings,gkRatings,supplement,teamPowers,envCities,venueInfo,betfairIndex,{articles:newsArticles,team_keywords:TEAM_KW},h2hData,teamInjuryPenalty);
          html+=renderMatch(pred,m);
        });
      });
    });

    // Knockout placeholder
    html+=`<div class="phase-title"><h2>🏆 淘汰赛阶段</h2></div>`;
    html+=`<div style="padding:16px;color:#78909c;font-size:11px;line-height:1.8">
      <p><b>32强:</b> 6月28日-7月3日 (16场) · <b>16强:</b> 7月4日-7日 (8场)</p>
      <p><b>四分之一决赛:</b> 7月9日-11日 (4场) · <b>半决赛:</b> 7月14日-15日 (2场)</p>
      <p><b>三四名决赛:</b> 7月18日 迈阿密 · <b>决赛:</b> 7月19日 纽约/新泽西MetLife体育场</p>
      <p style="margin-top:8px">淘汰赛对阵待小组赛结果确定后，Dixon-Coles模型将实时预测每场。</p>
    </div>`;

    content.innerHTML=html;
    console.log('Rendered',Object.keys(MATCHES_BY_DATE).reduce((s,k)=>s+MATCHES_BY_DATE[k].length,0),'matches');

  }catch(e){
    content.innerHTML=`<div style="padding:40px;text-align:center;color:#e53935">加载失败: ${e.message}<br><br>请确保通过HTTP访问(非file://)<br>或运行: python server.py</div>`;
    console.error(e);
  }
}

main();
</script>

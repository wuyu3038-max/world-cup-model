<script>
// ============ CHINESE NAMES ============
let ZT={},ZP={},ZC={},ZCI={};
function zhT(n){return ZT[n]||n} function zhP(n){return ZP[n]||n}
function zhC(n){return ZC[n]||n} function zhCi(n){return ZCI[n]||n}

// ============ DATA ============
const GROUPS = {
  A:['Mexico','South Africa','South Korea','Czech Republic'],
  B:['Canada','Bosnia-Herzegovina','Qatar','Switzerland'],
  C:['Brazil','Morocco','Haiti','Scotland'],
  D:['United States','Paraguay','Australia','Turkey'],
  E:['Germany','Curacao','Ivory Coast','Ecuador'],
  F:['Netherlands','Japan','Sweden','Tunisia'],
  G:['Belgium','Egypt','Iran','New Zealand'],
  H:['Spain','Cape Verde','Saudi Arabia','Uruguay'],
  I:['France','Senegal','Iraq','Norway'],
  J:['Argentina','Algeria','Austria','Jordan'],
  K:['Portugal','Congo DR','Uzbekistan','Colombia'],
  L:['England','Croatia','Ghana','Panama']
};

// ============ DC PREDICTION ENGINE (client-side) ============
function computeTeamStrength(players) {
  const ga = {};
  (players||[]).forEach(p => {
    const g = Number(p.goals_2526)||Number(p.goals_2025_26)||0;
    const a = Number(p.assists_2526)||Number(p.assists_2025_26)||0;
    ga[p.nation] = (ga[p.nation]||0) + g + a;
  });
  return ga;
}

function getFifaRank(team, rankings) {
  const r = (rankings||[]).find(x=>x.team===team);
  return r ? r.rank : 60;
}

function dcPredict(home, away, players, rankings, gkRatings) {
  const ga = computeTeamStrength(players);
  const ha = Number(ga[home])||0.1, aa = Number(ga[away])||0.1;
  const hr = getFifaRank(home, rankings), ar = getFifaRank(away, rankings);
  const hgk = gkRatings[home]||50, agk = gkRatings[away]||50;

  const attH = Math.log(Math.max(ha,0.3))*0.35 - 0.25;
  const attA = Math.log(Math.max(aa,0.3))*0.35 - 0.25;
  const defH = -(2200-hr*10)/6000 - (hgk-50)/400;
  const defA = -(2200-ar*10)/6000 - (agk-50)/400;

  const lam = Math.exp(0.30 + attH - defA);
  const mu = Math.exp(attA - defH);
  const rho = 0.05;

  let hw=0,dw=0,aw=0,o25=0,btts=0,total=0;
  const scores = [];
  for(let h=0;h<=10;h++){
    for(let a=0;a<=10;a++){
      let p = Math.pow(lam,h)*Math.exp(-lam)/fact(h) * Math.pow(mu,a)*Math.exp(-mu)/fact(a);
      if(h===0&&a===0) p*=(1-lam*mu*rho);
      else if(h===0&&a===1) p*=(1+lam*rho);
      else if(h===1&&a===0) p*=(1+mu*rho);
      else if(h===1&&a===1) p*=(1-rho);
      p = Math.max(p,0);
      scores.push({h,a,p});
      total+=p;
      if(h>a) hw+=p; else if(h===a) dw+=p; else aw+=p;
      if(h+a>2.5) o25+=p;
      if(h>0&&a>0) btts+=p;
    }
  }
  if(total>0){hw/=total;dw/=total;aw/=total;o25/=total;btts/=total;}
  scores.sort((a,b)=>b.p-a.p);
  // Upset index (Ben-Naim model: q=0.42 base upset rate for World Cup)
  const favP=Math.max(hw,aw), undP=Math.min(hw,aw);
  const powerDiff=Math.abs(attH-attA);
  const upsetRaw=0.42*Math.exp(-powerDiff*0.3);
  const upsetPct=Math.round(Math.min(upsetRaw,0.49)*100);
  return {
    hw,dw,aw, expHome:lam, expAway:mu, o25, btts, upsetPct,
    bestScore: scores[0]||{h:1,a:0},
    secondScore: scores[1]||{h:1,a:1},
    bestScoreProb: scores[0]?.p||0,
    secondScoreProb: scores[1]?.p||0,
    goalDiff: lam - mu
  };
}

function fact(n) { let r=1; for(let i=2;i<=n;i++) r*=i; return r; }

// ============ ASIAN HANDICAP ============
function computeAsianHandicap(pred) {
  const diff = pred.goalDiff;
  if (Math.abs(diff) < 0.3) return {line: '平手盘', pick: '平手盘 无方向', pickTeam: ''};
  if (diff >= 0.3 && diff < 0.7) return {line: '平手盘(主队方向)', pick: '推荐: 主队 平手', pickTeam: 'home'};
  if (diff >= 0.7 && diff < 1.1) return {line: '主让半球 (-0.5)', pick: '推荐: 主队 -0.5', pickTeam: 'home'};
  if (diff >= 1.1 && diff < 1.6) return {line: '主让半一 (-0.5/1)', pick: '推荐: 主队 -0.5/1', pickTeam: 'home'};
  if (diff >= 1.6 && diff < 2.1) return {line: '主让一球 (-1)', pick: '推荐: 主队 -1', pickTeam: 'home'};
  if (diff >= 2.1 && diff < 2.6) return {line: '主让球半 (-1.5)', pick: '推荐: 主队 -1.5', pickTeam: 'home'};
  if (diff >= 2.6) return {line: '主让两球 (-2)', pick: '推荐: 主队 -2', pickTeam: 'home'};
  if (diff <= -0.3 && diff > -0.7) return {line: '平手盘(客队方向)', pick: '推荐: 客队 平手', pickTeam: 'away'};
  if (diff <= -0.7 && diff > -1.1) return {line: '客让半球 (+0.5)', pick: '推荐: 客队 -0.5', pickTeam: 'away'};
  if (diff <= -1.1 && diff > -1.6) return {line: '客让半一 (+0.5/1)', pick: '推荐: 客队 -0.5/1', pickTeam: 'away'};
  if (diff <= -1.6 && diff > -2.1) return {line: '客让一球 (+1)', pick: '推荐: 客队 -1', pickTeam: 'away'};
  if (diff <= -2.1) return {line: '客让球半 (+1.5)', pick: '推荐: 客队 -1.5', pickTeam: 'away'};
  return {line: '平手盘', pick: '平手', pickTeam: ''};
}

// ============ RENDER ============
function renderMatch(pred, m) {
  const {hw,dw,aw,expHome,expAway,o25,btts,bestScore,secondScore,bestScoreProb,secondScoreProb} = pred;
  const ah = computeAsianHandicap(pred);

  // Determine best 1X2 pick
  let pick1x2, pickCls;
  if (hw >= dw && hw >= aw) { pick1x2 = '主胜'; pickCls = 'highlight'; }
  else if (dw >= hw && dw >= aw) { pick1x2 = '平局'; pickCls = ''; }
  else { pick1x2 = '客胜'; pickCls = 'highlight'; }

  // Score display bands
  const hBar = Math.round(hw*100);
  const dBar = Math.round(dw*100);
  const aBar = Math.round(aw*100);

  return `
  <div class="match-row">
    <div class="time">${m.g}组</div>
    <div class="matchup">
      <span>${zhT(m.h)}</span> <span class="vs">vs</span> <span>${zhT(m.a)}</span>
    </div>
    <div class="venue">${zhCi(m.v)||m.v}</div>
    <div class="odds-cell ${pickCls}">
      <div class="val">${pick1x2}</div>
      <div style="font-size:10px;margin-top:2px">

        <span style="color:#78909c;margin:0 2px">/</span>

        <span class="progress d" style="width:${dBar}px"></span>
        <span class="progress a" style="width:${aBar}px"></span>

    </div>

    </div>
    <div class="handicap">

      <div style="font-size:9px;color:#78909c">${ah.pickTeam==='home'?'主队方向':ah.pickTeam==='away'?'客队方向':'势均力敌'}</div>

  </div>`;
}

function renderSection(title, dateGroup, players, rankings, gkRatings) {
  let html = '';
  Object.entries(dateGroup).forEach(([date, matches]) => {
    html += `<div class="date-header"><h3>📅 ${date}</h3></div>`;
    matches.forEach(m => {
      const pred = dcPredict(m.h, m.a, players, rankings, gkRatings);
      m.date = date;
      html += renderMatch(pred, m);
    });
  });
  return html;
}

// ============ SEARCH / FILTER ============
function filterMatches(){
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const gf=document.getElementById('groupFilter')?.value||'';
  const df=document.getElementById('dateFilter')?.value||'';
  document.querySelectorAll('.match-row').forEach(row=>{
    const text=row.textContent.toLowerCase();
    const g=row.dataset.group||'',d=row.dataset.date||'';
    const mq=!q||text.includes(q),mg=!gf||g===gf,md=!df||d===df;
    row.style.display=(mq&&mg&&md)?'':'none';
  });
  // Hide/show date headers
  document.querySelectorAll('.date-header').forEach(h=>{
    const dd=h.dataset.date||'';
    const hasVisible=!!Array.from(document.querySelectorAll('.match-row[data-date="'+dd+'"]')).find(r=>r.style.display!=='none');
    h.style.display=hasVisible?'':'none';
  });
  // Hide/show phase titles
  document.querySelectorAll('.phase-title').forEach(h=>{
    let next=h.nextElementSibling;let vis=false;
    while(next&&!next.classList.contains('phase-title')){
      if((next.classList.contains('date-header')||next.classList.contains('match-row'))&&next.style.display!=='none')vis=true;
      next=next.nextElementSibling;
    }
    h.style.display=vis?'':'none';
  });
}
function clearFilters(){
  const si=document.getElementById('searchInput'),gf=document.getElementById('groupFilter'),df=document.getElementById('dateFilter');
  if(si)si.value='';if(gf)gf.value='';if(df)df.value='';
  filterMatches();
}

// ============ POPULATE DATE FILTER ============
function populateDateFilter(){
  const df=document.getElementById('dateFilter');
  if(!df)return;
  const dates=[...new Set(Array.from(document.querySelectorAll('.match-row')).map(r=>r.dataset.date))].sort();
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;df.appendChild(o);});
}

// Add data attributes to match rows after render
function attachMatchAttrs(){
  document.querySelectorAll('.match-row').forEach(row=>{
    const g=row.querySelector('.time')?.textContent?.replace('组','')||'';
    row.dataset.group=g;
    let el=row.previousElementSibling;
    while(el&&!el.classList.contains('date-header'))el=el.previousElementSibling;
    if(el)row.dataset.date=el.textContent.replace('📅 ','').trim();
  });
  populateDateFilter();
}
